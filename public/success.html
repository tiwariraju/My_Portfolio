<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Raju Tiwari</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0D0D0D 0%, #1E1E1E 100%);
      color: #E0E0E0;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,191,166,0.3);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      backdrop-filter: blur(12px);
      animation: fadeIn 0.8s ease;
    }
    .icon { font-size: 56px; color: #00BFA6; margin-bottom: 16px; }
    h1 { font-size: 1.75rem; margin-bottom: 12px; }
    p { color: #A0A0A0; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #00BFA6, #1DE9B6);
      color: #0D0D0D;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,191,166,0.35);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✔</div>
    <h1>Message Sent!</h1>
    <p>Thank you! I&apos;ll get back to you soon.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
