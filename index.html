<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Raju Tiwari - Java Full Stack Developer | Spring Boot & React | MCA @ NIET | 150+ DSA Problems | Software Engineer Intern"
    />
    <meta
      name="keywords"
      content="Raju Tiwari, Java Developer, Spring Boot, React, Full Stack Developer, Software Engineer, Portfolio, NIET"
    />
    <title>Raju Tiwari - Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font-family: Inter, sans-serif; background: #0d0d0d; color: #e0e0e0; text-align: center;">
        <p>JavaScript is required. Run <strong>npm run dev</strong> and open <strong>http://localhost:5173</strong></p>
      </div>
    </noscript>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D0D0D;color:#00BFA6;font-family:Inter,sans-serif;">
        Loading portfolio…
      </div>
    </div>
    <!-- Netlify form detection for SPA -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" id="app-entry" src="/src/main.jsx"></script>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('app-entry')?.remove();
        document.getElementById('root').innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif;background:#0D0D0D;color:#E0E0E0;text-align:center;">' +
          '<div><h1 style="color:#00BFA6;margin-bottom:12px;">Cannot open this file directly</h1>' +
          '<p style="color:#A0A0A0;max-width:420px;line-height:1.6;margin-bottom:16px;">This is a React app. Open terminal in the project folder and run:</p>' +
          '<p style="font-size:18px;color:#00BFA6;font-weight:600;margin-bottom:16px;">npm run dev</p>' +
          '<p style="color:#A0A0A0;">Then visit <strong style="color:#E0E0E0;">http://localhost:5173</strong></p></div></div>';
      }
    </script>
  </body>
</html>
